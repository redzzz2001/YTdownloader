<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader (Vercel)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f4;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center;">📥 Download Rápido</h2>
        <form id="f">
            <input type="url" id="u" placeholder="Link do YouTube" required>
            <select id="fmt">
                <option value="mp4">MP4 (Vídeo)</option>
                <option value="mp3">MP3 (Áudio)</option>
            </select>
            <button type="submit" id="b">Baixar</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('f').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('b');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.textContent = 'Buscando link...';

            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: document.getElementById('u').value,
                        format: document.getElementById('fmt').value
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Erro no servidor');
                }

                status.textContent = '✅ Link encontrado! Abrindo...';
                window.open(data.downloadUrl, '_blank');
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
